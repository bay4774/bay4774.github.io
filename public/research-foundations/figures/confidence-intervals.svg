<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
  <title id="title">固定真均值与随样本变化的区间</title>
  <desc id="desc">真均值固定为10。四个示意区间分别为8.8至10.8，9.3至11.3，10.2至12.2，8.4至10.4。第三个没有覆盖真均值。四条只为区分固定参数与变化的区间，不是覆盖率估计。</desc>
  <rect width="600" height="380" rx="12" fill="#f0f4ed"/>
  <g font-family="Microsoft YaHei,Arial,sans-serif" fill="#223c34" font-size="21">
    <text x="25" y="38" font-size="24" font-weight="600">参数固定，区间随每一批样本改变</text>
    <path d="M290 78V285" stroke="#9b6b25" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="255" y="68" fill="#8b5b1b">μ = 10</text>
    <g stroke="#214e40" stroke-width="4">
      <path d="M170 108H370M170 100V116M370 100V116"/>
      <path d="M220 159H420M220 151V167M420 151V167"/>
      <path d="M130 261H330M130 253V269M330 253V269"/>
    </g>
    <path d="M310 210H510M310 202V218M510 202V218" stroke="#b42318" stroke-width="4"/>
    <text x="25" y="115">样本 1</text><text x="25" y="166">样本 2</text><text x="25" y="217">样本 3</text><text x="25" y="268">样本 4</text>
    <path d="M90 300H540" stroke="#7c8c84" stroke-width="2"/>
    <text x="82" y="328">8</text><text x="182" y="328">9</text><text x="277" y="328">10</text><text x="377" y="328">11</text><text x="477" y="328">12</text>
    <text x="25" y="365" font-size="19">仅作结构示意；不能用四条线估计程序的长期覆盖率。</text>
  </g>
</svg>
