<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" role="img" aria-labelledby="title desc">
  <title id="title">Embodied research spotlight</title>
  <desc id="desc">Original conceptual diagram of a physical character, reference motion, state feedback, and contact support. This is an illustration, not measured research output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#112422"/>
      <stop offset=".6" stop-color="#0b1b1b"/>
      <stop offset="1" stop-color="#0a1519"/>
    </linearGradient>
    <radialGradient id="atmosphere">
      <stop stop-color="#284943" stop-opacity=".7"/>
      <stop offset="1" stop-color="#132727" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b4dfac"/>
      <stop offset=".55" stop-color="#79d7c8"/>
      <stop offset="1" stop-color="#80b8c6"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#53766a" stroke-width="1" opacity=".12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1000" height="960" fill="url(#background)"/>
